<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f1e6" />
    <!-- המערכת בהירה בלבד — מונע מדפדפנים עם "מצב כהה כפוי" (אנדרואיד) להפוך
         את הרקע לשחור. -->
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta
      name="description"
      content="VaddyGo — מערכת לניהול ועד הורים בגנים ובבתי ספר"
    />
    <!-- תגי שיתוף (Open Graph + Twitter) — כדי שהקישור ייראה מקצועי כשמשתפים בוואטסאפ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VaddyGo" />
    <meta property="og:title" content="VaddyGo — ניהול ועד הורים במקום אחד" />
    <meta
      property="og:description"
      content="גבייה, תשלומים, תלמידים, אירועים, מתנות וספקים — הכול מסודר במקום אחד, פשוט וברור. התחלה חינם."
    />
    <meta property="og:url" content="https://www.vaddygo.com/" />
    <meta property="og:image" content="https://www.vaddygo.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="he_IL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VaddyGo — ניהול ועד הורים במקום אחד" />
    <meta
      name="twitter:description"
      content="גבייה, תשלומים, תלמידים, אירועים, מתנות וספקים — הכול מסודר במקום אחד. התחלה חינם."
    />
    <meta name="twitter:image" content="https://www.vaddygo.com/og-image.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!-- פתיחה כאפליקציה עצמאית (מסך מלא, בלי שורת הכתובת של ספארי) בהוספה למסך הבית -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VaddyGo" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- פונט המותג של VaddyGo — Rubik (תומך עברית) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>VaddyGo — ארגון חכם. ניהול מנצח</title>
    <style>
      /* מסך פתיחה (טעינה) — לוגו + שם + סלוגן, לפי המוקאפ של בעלת המוצר.
         מוצג מיד עם טעינת האתר, ונעלם כשהאפליקציה עולה (React מחליף את #root). */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f7f1e6;
        z-index: 9999;
      }
      #app-splash .splash-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        padding: 24px;
        animation: splash-in 0.7s ease both;
      }
      #app-splash img {
        width: 150px;
        max-width: 42vw;
        height: auto;
        animation: splash-pulse 1.9s ease-in-out infinite;
      }
      #app-splash .splash-name {
        font-family: "Rubik", -apple-system, "Segoe UI", Arial, sans-serif;
        font-weight: 700;
        font-size: 42px;
        color: #2b201e;
        letter-spacing: 0.5px;
        margin-top: 4px;
      }
      #app-splash .splash-tag {
        font-family: "Rubik", -apple-system, "Segoe UI", "Noto Sans Hebrew",
          Arial, sans-serif;
        font-size: 17px;
        color: #6b5348;
        direction: rtl;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.95;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img,
        #app-splash .splash-box {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="app-splash">
        <div class="splash-box">
          <img src="%PUBLIC_URL%/logo.png" alt="" />
          <div class="splash-name">VaddyGo</div>
          <div class="splash-tag">ארגון חכם. ניהול מנצח.</div>
        </div>
      </div>
    </div>

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
